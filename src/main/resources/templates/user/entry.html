<html th:replace="~{layouts/base :: layout('ユーザー登録／変更', ~{::main}, ~{::script})}">
<main class="w-full flex flex-col flex-grow p-6">
	<div class="w-1/2 mt-2 my-6">
		<h2 class="text-xl pb-3 flex items-center"><i class="fas fa-list mr-3"></i>ユーザー情報</h2>

		<div th:if="${message}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4" th:text="${message}"></div>
		<div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4" th:text="${error}"></div>

		<form th:action="@{/user/entry}" method="post" th:object="${user}" class="p-10 bg-white rounded shadow-xl">
			<input type="hidden" th:field="*{id}">

			<div class="mt-2">
				<label for="userId" class="mt-2 ml-3 text-sm font-bold text-gray-700 tracking-wide">ユーザーID</label>
				<input type="text" th:field="*{userId}" tabindex="1" placeholder="ユーザーIDをご入力ください" id="userId"
					   th:readonly="${user.id != null}"
					   class="w-full content-center text-base px-4 py-2 border-b rounded-2xl border-gray-300 focus:outline-none focus:border-indigo-500"
					   th:classappend="${#fields.hasErrors('userId')} ? 'border-red-500' : ''">
				<p th:if="${#fields.hasErrors('userId')}" class="text-red-600 text-sm mt-1 ml-3" th:errors="*{userId}"></p>
			</div>

			<!-- パスワード：新規登録時のみ入力可能 -->
			<div class="mt-2" th:if="${user.id == null}">
				<label for="password" class="mt-2 ml-3 text-sm font-bold text-gray-700 tracking-wide">パスワード</label>
				<input type="password" th:field="*{password}" tabindex="1" placeholder="パスワードをご入力ください" id="password"
					   class="w-full content-center text-base px-4 py-2 border-b rounded-2xl border-gray-300 focus:outline-none focus:border-indigo-500"
					   th:classappend="${#fields.hasErrors('password')} ? 'border-red-500' : ''">
				<p th:if="${#fields.hasErrors('password')}" class="text-red-600 text-sm mt-1 ml-3" th:errors="*{password}"></p>
			</div>
			<!-- 編集時：既存のハッシュ値をそのまま保持（画面には表示しない） -->
			<input type="hidden" th:if="${user.id != null}" th:field="*{password}">

			<div class="mt-2">
				<label for="name" class="ml-3 text-sm font-bold text-gray-700 tracking-wide">氏名</label>
				<input type="text" th:field="*{name}" tabindex="1" placeholder="氏名をご入力ください" id="name"
					   class="w-full content-center text-base px-4 py-2 border-b rounded-2xl border-gray-300 focus:outline-none focus:border-indigo-500"
					   th:classappend="${#fields.hasErrors('name')} ? 'border-red-500' : ''">
				<p th:if="${#fields.hasErrors('name')}" class="text-red-600 text-sm mt-1 ml-3" th:errors="*{name}"></p>
			</div>

			<div class="mt-2">
				<label for="tel" class="ml-3 text-sm font-bold text-gray-700 tracking-wide">TEL</label>
				<input type="tel" th:field="*{tel}" tabindex="1" placeholder="電話番号をご入力ください" id="tel"
					   class="w-full content-center text-base px-4 py-2 border-b rounded-2xl border-gray-300 focus:outline-none focus:border-indigo-500"
					   th:classappend="${#fields.hasErrors('tel')} ? 'border-red-500' : ''">
				<p th:if="${#fields.hasErrors('tel')}" class="text-red-600 text-sm mt-1 ml-3" th:errors="*{tel}"></p>
			</div>

			<div class="mt-2">
				<label for="email" class="ml-3 text-sm font-bold text-gray-700 tracking-wide">Mail</label>
				<input type="email" th:field="*{email}" tabindex="1" placeholder="メールアドレスをご入力ください" id="email"
					   class="w-full content-center text-base px-4 py-2 border-b rounded-2xl border-gray-300 focus:outline-none focus:border-indigo-500"
					   th:classappend="${#fields.hasErrors('email')} ? 'border-red-500' : ''">
				<p th:if="${#fields.hasErrors('email')}" class="text-red-600 text-sm mt-1 ml-3" th:errors="*{email}"></p>
			</div>

			<div class="mt-4">
				<label for="role" class="block ml-3 text-sm font-bold text-gray-700 tracking-wide">権限</label>
				<select th:field="*{role}" id="role" tabindex="1"
						class="w-1/3 content-center text-base px-4 py-2 border-b rounded-2xl border-gray-300 focus:outline-none focus:border-indigo-500"
						th:classappend="${#fields.hasErrors('role')} ? 'border-red-500' : ''">
					<option value="">選択してください</option>
					<option value="0">一般</option>
					<option value="1">管理者</option>
				</select>
				<p th:if="${#fields.hasErrors('role')}" class="text-red-600 text-sm mt-1 ml-3" th:errors="*{role}"></p>
			</div>

			<div class="mt-4">
				<label class="block ml-3 text-sm font-bold text-gray-700 tracking-wide">状態</label>
				<div class="flex">
					<div class="flex items-center ml-4">
						<input id="status1" type="radio" value="1" th:field="*{status}" class="w-4 h-4">
						<label for="status1" class="ml-2">使用可能</label>
					</div>
					<div class="flex items-center ml-4">
						<input id="status0" type="radio" value="0" th:field="*{status}" class="w-4 h-4">
						<label for="status0" class="ml-2">使用不可</label>
					</div>
				</div>
				<p th:if="${#fields.hasErrors('status')}" class="text-red-600 text-sm mt-1 ml-3" th:errors="*{status}"></p>
			</div>

			<div class="mt-2">
				<label class="ml-3 block text-sm text-gray-700 font-bold" for="remarks">備考</label>
				<textarea th:field="*{remarks}" id="remarks" rows="6" tabindex="1" class="mt-2 w-full px-5 py-2 text-gray-700 bg-gray-100 rounded"></textarea>
			</div>

			<div class="flex flex-wrap mt-8">
				<div class="w-52 pr-5 mt-auto">
					<a th:href="@{/user}" tabindex="1" class="w-full flex justify-center bg-gradient-to-r from-gray-400 to-gray-500 hover:bg-gradient-to-l hover:from-gray-400 hover:to-gray-500 text-gray-100 p-2 rounded-full tracking-wide font-semibold shadow-lg cursor-pointer transition ease-in duration-500">戻る</a>
				</div>
				<div class="w-56 pr-2 mt-auto">
					<button type="submit" tabindex="1" class="w-full flex justify-center bg-gradient-to-r from-red-500 to-red-600 hover:bg-gradient-to-l hover:from-red-500 hover:to-red-600 text-gray-100 p-2 rounded-full tracking-wide font-semibold shadow-lg cursor-pointer transition ease-in duration-500"
							th:text="${user.id != null} ? '更新' : '登録'"></button>
				</div>
				<div class="w-56 mt-auto" th:if="${user.id != null}">
					<button type="submit" name="delete" tabindex="1" form="deleteForm" onclick="return confirm('削除してもよろしいですか？');" class="w-full flex justify-center bg-gradient-to-r from-gray-600 to-gray-700 hover:bg-gradient-to-l hover:from-gray-600 hover:to-gray-700 text-gray-100 p-2 rounded-full tracking-wide font-semibold shadow-lg cursor-pointer transition ease-in duration-500">削除</button>
				</div>
			</div>
		</form>
		<form th:if="${user.id != null}" id="deleteForm" th:action="@{/user/delete/{id}(id=${user.id})}" method="post"></form>
	</div>
</main>
<script></script>
</html>
