<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{include/head :: head('')}"></head>
<body class="h-screen overflow-hidden flex items-center justify-center" style="background: #edf2f7;">
<div class="relative min-h-screen w-screen flex">
		<div class="flex flex-col sm:flex-row items-center md:items-start sm:justify-center md:justify-start flex-auto min-w-0 bg-white">
			<div class="sm:w-1/2 lg:w-3/5 h-full hidden md:flex flex-auto items-center justify-center p-10 overflow-hidden bg-purple-900 text-white bg-no-repeat bg-cover relative p-loginBg">
				<div class="absolute bg-gradient-to-b from-indigo-600 to-blue-500 opacity-75 inset-0 z-0"></div>
				<div class="w-full max-w-md z-10">
					<h1 class="text-6xl font-bold mb-6 p-loginTitle">Inventory<br><span class="sm:hidden lg:inline">&emsp;</span>Management</h1>
				</div>
				<ul class="p-loginCircles"><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li></ul>
			</div>
			<div class="md:flex md:items-center md:justify-center w-full sm:w-auto md:h-full w-2/5 lg:w-2/5 p-8  md:p-10 lg:p-14 sm:rounded-lg md:rounded-none bg-white">
				<div class="max-w-md w-full space-y-8">
					<div class="text-center">
						<h2 class="mt-6 text-3xl font-bold text-gray-900">System Login</h2>
						<p class="mt-2 text-sm text-gray-500">Please login to your id</p>
					</div>

					<div th:if="${param.error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-2xl text-center text-sm">ユーザー名またはパスワードが正しくありません。</div>
					<div th:if="${param.logout}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-2xl text-center text-sm">ログアウトしました</div>

					<form class="mt-8 space-y-6" th:action="@{/login}" method="post">
						<div class="relative">
							<div class="absolute right-3 mt-4">
								<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
									<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
								</svg>
							</div>
							<!-- Change name="username" to name="userId" -->
							<label class="ml-3 text-sm font-bold text-gray-700 tracking-wide">ID</label>
							<input type="text" name="userId" value="" tabindex="1" autocomplete="off" placeholder="IDを入力してください" class=" w-full text-base px-4 py-2 border-b border-gray-300 focus:outline-none rounded-2xl focus:border-indigo-500">
						</div>
						<div class="mt-8 content-center relative">
							<label class="ml-3 text-sm font-bold text-gray-700 tracking-wide">Password</label>
							<input type="password" id="passwordInput" name="password" value="" tabindex="1" autocomplete="off" placeholder="パスワードを入力してください" class="w-full content-center text-base px-4 py-2 pr-10 border-b rounded-2xl border-gray-300 focus:outline-none focus:border-indigo-500">
							<button type="button" id="togglePassword" class="absolute right-3 top-9 text-gray-400 hover:text-gray-600 focus:outline-none">
								<svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
									<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
									<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
								</svg>
								<svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
									<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21" />
								</svg>
							</button>
						</div>
						<div class="flex items-center justify-between">
							<div class="w-full text-right text-sm">
								<a href="#" class="text-indigo-400 hover:text-blue-500">パスワードを忘れた方はこちら</a>
							</div>
						</div>
						<div>
							<button type="submit" name="send" tabindex="1" class="w-full flex justify-center bg-gradient-to-r from-indigo-500 to-blue-600  hover:bg-gradient-to-l hover:from-blue-500 hover:to-indigo-600 text-gray-100 p-4 rounded-full tracking-wide font-semibold  shadow-lg cursor-pointer transition ease-in duration-500">ログイン</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
	<div></div>
	<script>
	document.getElementById('togglePassword').addEventListener('click', function() {
		const input = document.getElementById('passwordInput');
		const eyeOpen = document.getElementById('eyeOpen');
		const eyeClosed = document.getElementById('eyeClosed');
		if (input.type === 'password') {
			input.type = 'text';
			eyeOpen.classList.add('hidden');
			eyeClosed.classList.remove('hidden');
		} else {
			input.type = 'password';
			eyeOpen.classList.remove('hidden');
			eyeClosed.classList.add('hidden');
		}
	});
	</script>
</body>
</html>
