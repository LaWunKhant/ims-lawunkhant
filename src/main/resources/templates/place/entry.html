<html th:replace="~{layouts/base :: layout('発注登録／変更', ~{::main}, ~{::script})}">
<main class="w-full flex flex-col flex-grow p-6">
	<div class="w-2/3 mt-2 my-6">
		<h2 class="text-xl pb-3 flex items-center"><i class="fas fa-list mr-3"></i>発注依頼登録変更</h2>

		<div th:if="${message}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4" th:text="${message}"></div>
		<div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4" th:text="${error}"></div>

		<form th:action="@{/place/entry}" method="post" th:object="${purchaseOrder}" class="p-10 bg-white rounded shadow-xl">
			<input type="hidden" th:field="*{id}">

			<div class="mt-4">
				<label for="companyId" class="block ml-3 text-sm font-bold text-gray-700 tracking-wide">発注先</label>
				<select name="companyId" id="companyId" tabindex="1"
						th:disabled="${purchaseOrder.id != null}"
						class="w-1/3 content-center text-base px-4 py-2 border-b rounded-2xl border-gray-300 focus:outline-none focus:border-indigo-500"
						th:classappend="${#fields.hasErrors('companyId')} ? 'border-red-500' : ''">
					<option value="">選択してください</option>
					<option th:each="company : ${companies}"
							th:value="${company.id}"
							th:text="${company.companyName}"
							th:selected="${purchaseOrder.companyId == company.id}">
					</option>
				</select>
				<p th:if="${#fields.hasErrors('companyId')}" class="text-red-600 text-sm mt-1 ml-3" th:errors="*{companyId}"></p>
			</div>

			<div class="mt-2">
				<label for="orderPlannedDate" class="block ml-3 text-sm font-bold text-gray-700 tracking-wide">発注予定日</label>
				<input type="date" name="orderPlannedDate" th:value="${#temporals.format(purchaseOrder.orderPlannedDate, 'yyyy-MM-dd')}" tabindex="1" id="orderPlannedDate"
					   th:readonly="${purchaseOrder.id != null}"
					   class="w-1/3 content-center text-base px-4 py-2 border-b rounded-2xl border-gray-300 focus:outline-none focus:border-indigo-500"
					   th:classappend="${#fields.hasErrors('orderPlannedDate')} ? 'border-red-500' : ''">
				<p th:if="${#fields.hasErrors('orderPlannedDate')}" class="text-red-600 text-sm mt-1 ml-3" th:errors="*{orderPlannedDate}"></p>
			</div>

			<div class="mt-2">
				<label for="productId" class="block ml-3 text-sm font-bold text-gray-700 tracking-wide">商品</label>
				<select name="productId" id="productId" tabindex="1"
						th:disabled="${purchaseOrder.id != null}"
						class="w-1/3 content-center text-base px-4 py-2 border-b rounded-2xl border-gray-300 focus:outline-none focus:border-indigo-500"
						th:classappend="${#fields.hasErrors('productId')} ? 'border-red-500' : ''">
					<option value="">選択してください</option>
					<option th:each="product : ${products}"
							th:value="${product.id}"
							th:text="${product.productName}"
							th:data-price="${product.price}"
							th:data-stock="${product.stock}"
							th:selected="${purchaseOrder.productId == product.id}">
					</option>
				</select>
				<p th:if="${#fields.hasErrors('productId')}" class="text-red-600 text-sm mt-1 ml-3" th:errors="*{productId}"></p>
			</div>

			<div class="mt-2">
				<label class="block mt-2 ml-3 text-sm font-bold text-gray-700 tracking-wide">仕入単価</label>
				<input type="text" id="unitPriceDisplay" class="w-1/3 content-center text-base px-4 py-2 border-b rounded-2xl border-gray-300" disabled>
			</div>

			<div class="mt-2">
				<label class="block ml-3 text-sm font-bold text-gray-700 tracking-wide">在庫数</label>
				<input type="text" id="stockDisplay" class="w-1/3 content-center text-base px-4 py-2 border-b rounded-2xl border-gray-300" disabled>
			</div>

			<div class="mt-2">
				<label for="quantity" class="block mt-2 ml-3 text-sm font-bold text-gray-700 tracking-wide">商品発注数</label>
				<input type="number" name="quantity" th:field="*{quantity}" id="quantity"
					   th:readonly="${purchaseOrder.id != null}"
					   class="w-1/3 content-center text-base px-4 py-2 border-b rounded-2xl border-gray-300 focus:outline-none focus:border-indigo-500"
					   th:classappend="${#fields.hasErrors('quantity')} ? 'border-red-500' : ''">
				<p th:if="${#fields.hasErrors('quantity')}" class="text-red-600 text-sm mt-1 ml-3" th:errors="*{quantity}"></p>
			</div>

			<div class="mt-2">
				<label class="block mt-2 ml-3 text-sm font-bold text-gray-700 tracking-wide">金額</label>
				<input type="text" id="amountDisplay" class="w-1/3 content-center text-base px-4 py-2 border-b rounded-2xl border-gray-300" readonly>
			</div>

			<div class="mt-4">
				<label class="block ml-3 text-sm font-bold text-gray-700 tracking-wide">課税</label>
				<div class="flex">
					<div class="flex items-center ml-4">
						<input id="taxFlag0" type="radio" value="0" th:field="*{taxFlag}" th:disabled="${purchaseOrder.id != null}" class="w-4 h-4">
						<label for="taxFlag0" class="ml-2">非課税</label>
					</div>
					<div class="flex items-center ml-4">
						<input id="taxFlag1" type="radio" value="1" th:field="*{taxFlag}" th:disabled="${purchaseOrder.id != null}" class="w-4 h-4">
						<label for="taxFlag1" class="ml-2">課税</label>
					</div>
				</div>
			</div>

			<div class="mt-2">
				<label class="block mt-2 ml-3 text-sm font-bold text-gray-700 tracking-wide">支払金額</label>
				<input type="text" th:field="*{paymentAmount}" class="w-1/3 content-center text-base px-4 py-2 border-b rounded-2xl border-gray-300" readonly>
			</div>

			<div class="mt-2">
				<label class="block ml-3 text-sm font-bold text-gray-700 tracking-wide">発注日</label>
				<input type="text" th:value="${purchaseOrder.orderDate != null} ? ${#temporals.format(purchaseOrder.orderDate, 'yyyy/MM/dd')} : '-'" class="w-1/3 content-center text-base px-4 py-2 border-b rounded-2xl border-gray-300" disabled>
			</div>

			<div class="mt-2">
				<label class="block ml-3 text-sm font-bold text-gray-700 tracking-wide">仕入日</label>
				<input type="text" th:value="${purchaseOrder.purchaseDate != null} ? ${#temporals.format(purchaseOrder.purchaseDate, 'yyyy/MM/dd')} : '-'" class="w-1/3 content-center text-base px-4 py-2 border-b rounded-2xl border-gray-300" disabled>
			</div>

			<div class="flex flex-wrap gap-3 mt-10">
				<a th:href="@{/place}" style="min-width:120px; background:#9ca3af; color:white; font-weight:bold; padding:12px 24px; border-radius:9999px; text-align:center; box-shadow:0 4px 6px rgba(0,0,0,0.1); cursor:pointer; text-decoration:none;">戻る</a>

				<!-- 登録: 新規登録のみ活性化 -->
				<button th:if="${purchaseOrder.id == null}" type="submit"
						style="min-width:120px; background:#dc2626; color:white; font-weight:bold; padding:12px 24px; border-radius:9999px; box-shadow:0 4px 6px rgba(0,0,0,0.1); cursor:pointer; border:none;">登録</button>

				<!-- 削除: 未発注のみ活性化 -->
				<button th:if="${purchaseOrder.id != null and purchaseOrder.status == 0}"
						type="submit" form="deleteForm" onclick="return confirm('削除してもよろしいですか？');"
						style="min-width:120px; background:#374151; color:white; font-weight:bold; padding:12px 24px; border-radius:9999px; box-shadow:0 4px 6px rgba(0,0,0,0.1); cursor:pointer; border:none;">削除</button>

				<!-- 発注する: 未発注のみ活性化 -->
				<button th:if="${purchaseOrder.id != null and purchaseOrder.status == 0}"
						type="submit" form="orderForm"
						style="min-width:120px; background:#ea580c; color:white; font-weight:bold; padding:12px 24px; border-radius:9999px; box-shadow:0 4px 6px rgba(0,0,0,0.1); cursor:pointer; border:none;">発注する</button>

				<!-- 発注解除: 発注済のみ活性化 -->
				<button th:if="${purchaseOrder.id != null and purchaseOrder.status == 1}"
						type="submit" form="cancelForm"
						style="min-width:120px; background:#65a30d; color:white; font-weight:bold; padding:12px 24px; border-radius:9999px; box-shadow:0 4px 6px rgba(0,0,0,0.1); cursor:pointer; border:none;">発注解除</button>

				<!-- 仕入する: 発注済のみ活性化 -->
				<button th:if="${purchaseOrder.id != null and purchaseOrder.status == 1}"
						type="submit" form="purchaseForm"
						style="min-width:120px; background:#4d7c0f; color:white; font-weight:bold; padding:12px 24px; border-radius:9999px; box-shadow:0 4px 6px rgba(0,0,0,0.1); cursor:pointer; border:none;">仕入する</button>
			</div>
		</form>

		<form th:if="${purchaseOrder.id != null}" id="deleteForm" th:action="@{/place/delete/{id}(id=${purchaseOrder.id})}" method="post"></form>
		<form th:if="${purchaseOrder.id != null}" id="orderForm" th:action="@{/place/order/{id}(id=${purchaseOrder.id})}" method="post"></form>
		<form th:if="${purchaseOrder.id != null}" id="cancelForm" th:action="@{/place/cancel/{id}(id=${purchaseOrder.id})}" method="post"></form>
		<form th:if="${purchaseOrder.id != null}" id="purchaseForm" th:action="@{/place/purchase/{id}(id=${purchaseOrder.id})}" method="post"></form>
	</div>
</main>
<script>
	const productSelect = document.getElementById('productId');
	const quantityInput = document.getElementById('quantity');
	const unitPriceDisplay = document.getElementById('unitPriceDisplay');
	const stockDisplay = document.getElementById('stockDisplay');
	const amountDisplay = document.getElementById('amountDisplay');
	const taxFlag0 = document.getElementById('taxFlag0');
	const taxFlag1 = document.getElementById('taxFlag1');
	const paymentAmountInput = document.querySelector('input[name="paymentAmount"]');

	function recalculate() {
		let unitPrice = 0;
		if (productSelect.value) {
			const selected = productSelect.options[productSelect.selectedIndex];
			unitPrice = parseInt(selected.getAttribute('data-price')) || 0;
			unitPriceDisplay.value = unitPrice;
			stockDisplay.value = selected.getAttribute('data-stock') || 0;
		} else {
			unitPriceDisplay.value = '';
			stockDisplay.value = '';
		}

		const quantity = parseInt(quantityInput.value) || 0;
		const amount = unitPrice * quantity;
		amountDisplay.value = amount;

		const taxFlag = taxFlag1.checked ? 1 : 0;
		const paymentAmount = taxFlag === 1 ? Math.round(amount * 1.10) : amount;
		paymentAmountInput.value = paymentAmount;
	}

	productSelect.addEventListener('change', recalculate);
	quantityInput.addEventListener('input', recalculate);
	taxFlag0.addEventListener('change', recalculate);
	taxFlag1.addEventListener('change', recalculate);

	recalculate();
</script>
</html>
