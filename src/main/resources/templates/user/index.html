<html th:replace="~{layouts/base :: layout('ユーザーマスタ', ~{::main}, ~{::script})}">
<main class="w-full flex flex-col flex-grow p-6">

	<div th:if="${message}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4" th:text="${message}"></div>
	<div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4" th:text="${error}"></div>

	<form th:action="@{/user}" method="get">
		<div class="w-3/6 flex">
			<div class="w-1/2 pr-2">
				<label for="userid" class="ml-3 text-sm font-bold text-gray-700 tracking-wide">ユーザーID</label>
				<input type="text" name="userid" th:value="${userid}" tabindex="1" placeholder="ユーザーIDをご入力ください" id="userid" class="w-full content-center text-base px-4 py-2 border-b rounded-2xl border-gray-300 focus:outline-none focus:border-indigo-500">
			</div>
			<div class="w-1/2">
				<label for="tel" class="ml-3 text-sm font-bold text-gray-700 tracking-wide">電話番号</label>
				<input type="tel" name="tel" th:value="${tel}" tabindex="1" placeholder="03-0000-0000" id="tel" class="w-full content-center text-base px-4 py-2 border-b rounded-2xl border-gray-300 focus:outline-none focus:border-indigo-500">
			</div>
		</div>
		<div class="flex flex-wrap mt-2">
			<div class="w-3/6 pr-2 flex">
				<div class="w-1/2 pr-2">
					<label for="name" class="ml-3 text-sm font-bold text-gray-700 tracking-wide">氏名</label>
					<input type="text" name="name" th:value="${name}" tabindex="1" placeholder="氏名をご入力ください" id="name" class="w-full content-center text-base px-4 py-2 border-b rounded-2xl border-gray-300 focus:outline-none focus:border-indigo-500">
				</div>
				<div class="w-1/2">
					<label for="email" class="ml-3 text-sm font-bold text-gray-700 tracking-wide">メール</label>
					<input type="email" name="email" th:value="${email}" tabindex="1" placeholder="info@example.com" id="email" class="w-full content-center text-base px-4 py-2 border-b rounded-2xl border-gray-300 focus:outline-none focus:border-indigo-500">
				</div>
			</div>
			<div class="w-1/6 pr-2 mt-auto">
				<a th:href="@{/user}" tabindex="1" class="w-full flex justify-center bg-gradient-to-r from-gray-500 to-gray-600 hover:bg-gradient-to-l hover:from-gray-500 hover:to-gray-600 text-gray-100 p-2 rounded-full tracking-wide font-semibold shadow-lg cursor-pointer transition ease-in duration-500">クリア</a>
			</div>
			<div class="w-1/6 pr-2 mt-auto">
				<button type="submit" name="search" tabindex="1" class="w-full flex justify-center bg-gradient-to-r from-indigo-500 to-blue-600 hover:bg-gradient-to-l hover:from-blue-500 hover:to-indigo-600 text-gray-100 p-2 rounded-full tracking-wide font-semibold shadow-lg cursor-pointer transition ease-in duration-500">検索</button>
			</div>
			<div class="w-1/6 mt-auto">
				<a th:href="@{/user/entry}" tabindex="1" class="w-full flex justify-center bg-gradient-to-r from-green-500 to-green-600 hover:bg-gradient-to-l hover:from-green-500 hover:to-green-600 text-gray-100 p-2 rounded-full tracking-wide font-semibold shadow-lg cursor-pointer transition ease-in duration-500">登録</a>
			</div>
		</div>
	</form>
	<div class="w-full mt-2">
		<h2 class="text-xl pb-3 flex items-center mt-5"><i class="fas fa-list mr-3"></i>ユーザー一覧</h2>
		<div class="bg-white u-widthMin">
			<table class="border-2 border-gray-100 min-w-full bg-white">
				<thead class="bg-gray-800 text-white">
					<tr>
						<th class="py-3 px-4 uppercase font-semibold text-sm">ユーザーID</th>
						<th class="w-1/5 py-3 px-4 uppercase font-semibold text-left text-sm">氏名</th>
						<th class="py-3 px-4 uppercase font-semibold text-sm">TEL</th>
						<th class="w-1/5 py-3 px-4 uppercase font-semibold text-left text-sm">メール</th>
						<th class="py-3 px-4 uppercase font-semibold text-sm">権限</th>
						<th class="py-3 px-4 uppercase font-semibold text-sm">状態</th>
						<th class="w-1/5 py-3 px-4 uppercase font-semibold text-sm">備考</th>
					</tr>
				</thead>
				<tbody class="text-gray-700">
					<tr th:if="${users.empty}">
						<td class="border text-center py-3 px-4" colspan="7">表示するデータがありません</td>
					</tr>
					<tr th:each="user, stat : ${users}" th:classappend="${stat.odd} ? 'bg-gray-200' : ''">
						<td class="border text-center py-3 px-4">
							<a th:href="@{/user/entry/{id}(id=${user.id})}" class="underline underline-offset-4 hover:text-blue-500" th:text="${user.userId}"></a>
						</td>
						<td class="border text-left py-3 px-4" th:text="${user.name}"></td>
						<td class="border text-center py-3 px-4" th:text="${user.tel != null} ? ${user.tel} : '-'"></td>
						<td class="border text-left py-3 px-4">
							<a class="underline underline-offset-4 hover:text-blue-500" th:href="'mailto:' + ${user.email}" th:text="${user.email}"></a>
						</td>
						<td class="border text-center py-3 px-4" th:text="${user.getRoleLabel()}"></td>
						<td class="border text-center py-3 px-4" th:text="${user.getStatusLabel()}"></td>
						<td class="border text-left py-3 px-4" th:text="${user.remarks != null} ? ${user.remarks} : ''"></td>
					</tr>
				</tbody>
			</table>
		</div>
		<form th:if="${users.totalPages > 0}" class="flex mt-3" th:action="@{/user}" method="get">
			<ul class="inline-flex space-x-2 m-auto">
				<li>
					<a th:if="${users.hasPrevious()}"
					   th:href="@{/user(page=${users.number - 1}, userid=${userid}, tel=${tel}, name=${name}, email=${email})}"
					   class="flex items-center justify-center w-10 h-10 text-indigo-600 transition-colors duration-150 rounded-full focus:shadow-outline hover:bg-indigo-100">
						<svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" fill-rule="evenodd"></path></svg>
					</a>
					<span th:unless="${users.hasPrevious()}" class="flex items-center justify-center w-10 h-10 text-gray-400">
						<svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" fill-rule="evenodd"></path></svg>
					</span>
				</li>
				<li th:each="pageNum : ${#numbers.sequence(1, users.totalPages)}">
					<a th:if="${pageNum - 1 != users.number}"
					   th:href="@{/user(page=${pageNum - 1}, userid=${userid}, tel=${tel}, name=${name}, email=${email})}"
					   th:text="${pageNum}"
					   class="w-10 h-10 text-indigo-600 transition-colors duration-150 rounded-full hover:bg-indigo-100 focus:shadow-outline flex items-center justify-center">
					</a>
					<span th:if="${pageNum - 1 == users.number}"
					      th:text="${pageNum}"
					      class="w-10 h-10 text-white transition-colors duration-150 bg-indigo-600 border border-r-0 border-indigo-600 rounded-full focus:shadow-outline flex items-center justify-center">
					</span>
				</li>
				<li>
					<a th:if="${users.hasNext()}"
					   th:href="@{/user(page=${users.number + 1}, userid=${userid}, tel=${tel}, name=${name}, email=${email})}"
					   class="flex items-center justify-center w-10 h-10 text-indigo-600 transition-colors duration-150 rounded-full focus:shadow-outline hover:bg-indigo-100">
						<svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" fill-rule="evenodd"></path></svg>
					</a>
					<span th:unless="${users.hasNext()}" class="flex items-center justify-center w-10 h-10 text-gray-400">
						<svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" fill-rule="evenodd"></path></svg>
					</span>
				</li>
			</ul>
		</form>
	</div>
</main>
<script></script>
</html>
