<html th:replace="~{layouts/base :: layout('勤怠管理', ~{::main}, ~{::script})}">
<main class="w-full flex flex-col flex-grow p-6">

	<div th:if="${successMessage}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4 u-widthMin" th:text="${successMessage}"></div>
	<div th:if="${errorMessage}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 u-widthMin" th:text="${errorMessage}"></div>

	<div class="w-full mt-10">
		<div class="flex flex-wrap justify-center">
			<div class="w-2/5 p-10">
				<form th:action="@{/attendance/clock-in}" method="post">
					<button type="submit" name="timeIn" tabindex="1" th:disabled="${clockedIn}"
							class="w-full flex p-7 justify-center bg-gradient-to-r from-red-500 to-red-600 hover:bg-gradient-to-l hover:from-red-500 hover:to-red-600 disabled:opacity-40 disabled:cursor-not-allowed text-gray-100 p-2 rounded-full tracking-wide text-xl font-semibold shadow-lg cursor-pointer transition ease-in duration-500">
						<i class="fa-solid fa-right-to-bracket leading-none text-3xl mr-3"></i>出勤ボタン
					</button>
				</form>
			</div>
			<div class="w-2/5 p-10">
				<form th:action="@{/attendance/clock-out}" method="post">
					<button type="submit" name="timeOut" tabindex="1" th:disabled="${!clockedIn}"
							class="w-full flex p-7 justify-center bg-gradient-to-r from-indigo-500 to-blue-600 hover:bg-gradient-to-l hover:from-blue-500 hover:to-indigo-600 disabled:opacity-40 disabled:cursor-not-allowed text-gray-100 p-2 rounded-full tracking-wide text-xl font-semibold shadow-lg cursor-pointer transition ease-in duration-500">
						<i class="fa-solid fa-right-from-bracket leading-none text-3xl mr-3"></i>退勤ボタン
					</button>
				</form>
			</div>
		</div>
	</div>

	<h2 class="text-xl pb-3 flex items-center mt-5"><i class="fas fa-list mr-3"></i>勤怠一覧</h2>
	<div class="bg-white u-widthMin">
		<table class="border-2 border-gray-100 min-w-full bg-white">
			<thead class="bg-gray-800 text-white">
				<tr>
					<th class="w-1/4 py-3 px-4 uppercase font-semibold text-sm">出勤日時</th>
					<th class="w-1/4 py-3 px-4 uppercase font-semibold text-sm">退勤日時</th>
					<th class="w-1/4 py-3 px-4 uppercase font-semibold text-sm">労働時間</th>
					<th class="w-1/4 py-3 px-4 uppercase font-semibold text-sm">時間外時間</th>
				</tr>
			</thead>
			<tbody class="text-gray-700">
				<tr th:if="${#lists.isEmpty(attendanceList)}">
					<td class="border text-center py-3 px-4" colspan="4">表示するデータがありません</td>
				</tr>
				<tr th:each="attendance : ${attendanceList}">
					<td class="border text-center py-3 px-4" th:text="${#temporals.format(attendance.clockIn, 'yyyy/M/d HH:mm')}"></td>
					<td class="border text-center py-3 px-4" th:text="${attendance.clockOut != null} ? ${#temporals.format(attendance.clockOut, 'yyyy/M/d HH:mm')} : '-'"></td>
					<td class="border text-center py-3 px-4" th:text="${attendance.workingHours != null} ? ${attendance.workingHours} + 'h' : '-'"></td>
					<td class="border text-center py-3 px-4" th:text="${attendance.overtimeHours != null} ? ${attendance.overtimeHours} + 'h' : '-'"></td>
				</tr>
			</tbody>
		</table>
	</div>

</main>
<script></script>
</html>
