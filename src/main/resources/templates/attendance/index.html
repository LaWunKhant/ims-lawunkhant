<html th:replace="~{layouts/base :: layout('勤怠管理', ~{::main}, ~{::script})}">
<main class="w-full flex flex-col flex-grow p-6">

	<div th:if="${successMessage}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4 u-widthMin" th:text="${successMessage}"></div>
	<div th:if="${errorMessage}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 u-widthMin" th:text="${errorMessage}"></div>

	<div class="w-full mt-10">
	    <div class="flex flex-wrap justify-center">
	        <div class="w-2/5 p-10">
	            <form th:action="@{/attendance/clock-in}" method="post">
	                <button type="submit" name="timeIn" tabindex="1" th:disabled="${clockedIn}"
	                        th:class="${clockedIn} 
	                            ? 'w-full flex p-7 justify-center bg-gray-300 text-gray-500 p-2 rounded-full tracking-wide text-xl font-semibold cursor-not-allowed'
	                            : 'w-full flex p-7 justify-center bg-gradient-to-r from-red-500 to-red-600 hover:bg-gradient-to-l hover:from-red-500 hover:to-red-600 text-gray-100 p-2 rounded-full tracking-wide text-xl font-semibold shadow-lg cursor-pointer transition ease-in duration-500'">
	                    <i class="fa-solid fa-right-to-bracket leading-none text-3xl mr-3"></i>出勤ボタン
	                </button>
	            </form>
	        </div>
	        <div class="w-2/5 p-10">
	            <form th:action="@{/attendance/clock-out}" method="post">
	                <button type="submit" name="timeOut" tabindex="1" th:disabled="${!clockedIn}"
	                        th:class="${!clockedIn} 
	                            ? 'w-full flex p-7 justify-center bg-gray-300 text-gray-500 p-2 rounded-full tracking-wide text-xl font-semibold cursor-not-allowed'
	                            : 'w-full flex p-7 justify-center bg-gradient-to-r from-indigo-500 to-blue-600 hover:bg-gradient-to-l hover:from-blue-500 hover:to-indigo-600 text-gray-100 p-2 rounded-full tracking-wide text-xl font-semibold shadow-lg cursor-pointer transition ease-in duration-500'">
	                    <i class="fa-solid fa-right-from-bracket leading-none text-3xl mr-3"></i>退勤ボタン
	                </button>
	            </form>
	        </div>
	    </div>
	</div>

	<h2 class="text-xl pb-3 flex items-center mt-5"><i class="fas fa-list mr-3"></i>勤怠一覧</h2>
	<div class="bg-white u-widthMin">
		<table class="border-2 border-gray-100 min-w-full bg-white">
			<thead class="bg-gray-800 text-white">
				<tr>
					<th class="w-1/4 py-3 px-4 uppercase font-semibold text-sm">出勤日時</th>
					<th class="w-1/4 py-3 px-4 uppercase font-semibold text-sm">退勤日時</th>
					<th class="w-1/4 py-3 px-4 uppercase font-semibold text-sm">労働時間</th>
					<th class="w-1/4 py-3 px-4 uppercase font-semibold text-sm">時間外時間</th>
				</tr>
			</thead>
			<tbody class="text-gray-700">
			    <tr th:if="${attendancePage.empty}">
			        <td class="border text-center py-3 px-4" colspan="4">表示するデータがありません</td>
			    </tr>
			    <tr th:each="attendance : ${attendancePage.content}">
			        <td class="border text-center py-3 px-4" th:text="${#temporals.format(attendance.clockIn, 'yyyy/M/d HH:mm')}"></td>
			        <td class="border text-center py-3 px-4" th:text="${attendance.clockOut != null} ? ${#temporals.format(attendance.clockOut, 'yyyy/M/d HH:mm')} : '-'"></td>
			        <td class="border text-center py-3 px-4" th:text="${attendance.workingHours != null} ? ${attendance.workingHours} + 'h' : '-'"></td>
			        <td class="border text-center py-3 px-4" th:text="${attendance.overtimeHours != null} ? ${attendance.overtimeHours} + 'h' : '-'"></td>
			    </tr>
			</tbody>
		</table>
		<div class="flex justify-center mt-6" th:if="${attendancePage.totalPages > 1}">
		    <ul class="inline-flex space-x-2 m-auto">
		        <li th:if="${attendancePage.hasPrevious()}">
		            <a th:href="@{/attendance(page=${attendancePage.number - 1})}"
		               class="flex items-center justify-center w-10 h-10 text-indigo-600 transition-colors duration-150 rounded-full hover:bg-indigo-100">
		                <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" fill-rule="evenodd"></path></svg>
		            </a>
		        </li>
		        <li th:each="i : ${#numbers.sequence(0, attendancePage.totalPages - 1)}">
		            <a th:href="@{/attendance(page=${i})}" th:text="${i + 1}"
		               th:classappend="${i == attendancePage.number} ? 'text-white bg-indigo-600 border border-indigo-600' : 'text-indigo-600 hover:bg-indigo-100'"
		               class="flex items-center justify-center w-10 h-10 transition-colors duration-150 rounded-full"></a>
		        </li>
		        <li th:if="${attendancePage.hasNext()}">
		            <a th:href="@{/attendance(page=${attendancePage.number + 1})}"
		               class="flex items-center justify-center w-10 h-10 text-indigo-600 transition-colors duration-150 rounded-full hover:bg-indigo-100">
		                <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" fill-rule="evenodd"></path></svg>
		            </a>
		        </li>
		    </ul>
		</div>
	</div>

</main>
<script></script>
</html>
