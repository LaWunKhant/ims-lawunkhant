<th:block th:fragment="toast" xmlns:th="http://www.thymeleaf.org">
    <div id="toast" style="display:none;">
        <p id="toastMessage" style="margin:0;"></p>
    </div>
    <script>
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = message;

            toast.style.position = 'fixed';
            toast.style.top = '24px';
            toast.style.right = '24px';
            toast.style.zIndex = '9999';
            toast.style.maxWidth = '384px';
            toast.style.padding = '12px 16px';
            toast.style.borderRadius = '6px';
            toast.style.boxShadow = '0 10px 15px -3px rgba(0,0,0,0.1)';
            toast.style.fontWeight = '600';
            toast.style.fontSize = '14px';

            if (type === 'error') {
                toast.style.backgroundColor = '#fee2e2';
                toast.style.border = '1px solid #f87171';
                toast.style.color = '#b91c1c';
            } else {
                toast.style.backgroundColor = '#dcfce7';
                toast.style.border = '1px solid #4ade80';
                toast.style.color = '#15803d';
            }

            toast.style.display = 'block';

            setTimeout(function() {
                toast.style.display = 'none';
            }, 3000);
        }

        function handleGatedClick(el) {
            const canAccess = el.dataset.canAccess === 'true';
            if (canAccess) {
                window.location.href = el.dataset.href;
                return;
            }
            const clockedIn = el.dataset.clockedIn === 'true';
            const message = clockedIn ? '労働時間が12時間を超えております。' : '出勤操作をお願い致します。';
            showToast(message, 'error');
        }
    </script>
</th:block>
