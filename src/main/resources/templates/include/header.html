<header th:fragment="header(title)" class="l-header w-full flex items-center bg-white py-2 px-6">
	<h1 th:text="${title} == '' ? '' : ${title}" class="w-1/2 text-xl font-bold"></h1>
	<div class="relative w-1/2 flex justify-end items-center">
		<p class="leading-9 mr-3" th:text="${loginUserName} + ' 様'">テスト 太郎 様</p>
		<form th:action="@{/logout}" method="post" class="m-0">
			<button type="submit" class="realtive z-10 w-10 h-10 rounded-full overflow-hidden border-4 border-gray-400 hover:border-gray-300 focus:border-gray-300 focus:outline-none">
				<i class="fa-solid fa-power-off"></i>
			</button>
		</form>
	</div>
</header>
